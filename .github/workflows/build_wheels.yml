name: Build wheels

# Builds the wheels of PySCIPOpt and of its variants PySCIPOpt-debug and
# PySCIPOpt-exact (SCIP in debug mode / with exact solving, see
# scripts/rename_package.py). A failed variant doesn't fail the run and isn't uploaded.

on:
  workflow_dispatch:
      inputs:
          upload_to_pypi:
              type: boolean
              description: Should upload
              required: false
              default: true
          test_pypi:
              type: boolean
              description: Use Test PyPI
              required: false
              default: true

jobs:
  build_wheels:
    name: Build ${{ matrix.variant }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.variant != 'release' }}
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug, exact]
        os: [ubuntu-22.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
        include:
          - {os: ubuntu-22.04, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: macos-15, arch: arm64}
          - {os: macos-15-intel, arch: x86_64}
          - {os: windows-latest, arch: AMD64}

    steps:
      - uses: actions/checkout@v4

      - name: Rename package
        if: matrix.variant != 'release'
        run: python scripts/rename_package.py ${{ matrix.variant }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_TEST: "pip install -r {project}/requirements/test.txt"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          SCIP_ARTIFACT_SUFFIX: ${{ matrix.variant != 'release' && format('-{0}', matrix.variant) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.variant }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  # variants are wheels only: built from source, they'd use whatever SCIP is installed
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        shell: bash -l {0}
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist-release
          path: dist/*.tar.gz

  # needs every release wheel; failed variants are skipped by publish_wheels.yml
  upload_pypi:
    needs: [build_wheels, build_sdist]
    if: inputs.upload_to_pypi
    uses: ./.github/workflows/publish_wheels.yml
    with:
      test_pypi: ${{ inputs.test_pypi }}
    secrets: inherit
