name: Review checklist

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/review_checklist.md
          sparse-checkout-cone-mode: false
      - run: gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file .github/review_checklist.md
        env:
          GH_TOKEN: ${{ github.token }}
